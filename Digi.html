<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de Digi - Sergio Pereda</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }
        header p {
            color: #7f8c8d;
            font-size: 1.2rem;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #4a90e2;
        }
        .card h2 {
            margin: 0 0 10px 0;
            color: #2c3e50;
            font-size: 1.5rem;
        }
        .card p {
            color: #7f8c8d;
            margin: 0;
            font-size: 0.95rem;
        }
        .btn-volver {
            margin-top: 40px;
            text-decoration: none;
            color: #7f8c8d;
            font-weight: bold;
            transition: color 0.2s;
        }
        .btn-volver:hover {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<header>
    <h1>Ejercicios de DIGI</h1>
    <p>Repositorio secundario de prácticas específicas</p>
</header>
<main class="container">

    <a href="EJERICIO DEL CV.html" class="card">
        <h2>Mi Currículum</h2>
        <p>Ejercicio 1: Estructura de CV Personal</p>
    </a>
</main>
<a href="index.html" class="btn-volver">← Volver al Panel Principal</a>

</body>
</html>
